<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Where's Jesus? 耶穌在哪?</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .canvas-container {
            cursor: crosshair;
            touch-action: none;
        }
        #orientation-warning {
            display: none;
        }
        @media screen and (max-width: 900px) and (orientation: portrait) {
            #orientation-warning {
                display: flex !important;
            }
        }
        /* 手機端專屬調整 */
        @media screen and (max-width: 900px) {
            body {
                padding: 4px !important;
                background-color: #fef3c7 !important;
                height: 100vh !important;
                overflow: hidden !important;
            }
            .pc-header, .pc-sidebar {
                display: none !important;
            }
            .mobile-header-bar {
                margin-bottom: 2px !important;
            }
            .mobile-game-container {
                width: 100vw !important;
                max-width: none !important;
                padding: 0 !important;
                margin: 0 !important;
                border: none !important;
                background: transparent !important;
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
                justify-content: center !important;
            }
            #canvas-game {
                width: auto !important;
                height: auto !important;
                max-width: 98vw !important;
                max-height: 62vh !important;
                object-fit: contain !important;
                border-radius: 8px !important;
            }
            /* 手機橫向彈窗極致緊湊與自適應捲動優化 */
            #modal > div, #mobile-intro-modal > div {
                padding: 0.5rem 0.75rem !important;
                max-width: 80vw !important;
                max-height: 90vh !important;
                overflow-y: auto !important;
                gap: 0.15rem !important;
            }
            #mobile-intro-modal h2, #modal h2 {
                font-size: 1rem !important;
                margin: 0 !important;
            }
            #mobile-intro-modal .text-3xl, #modal-icon {
                font-size: 1.2rem !important;
                margin-bottom: -0.1rem !important;
            }
            #mobile-intro-modal .bg-amber-50 {
                padding: 0.15rem !important;
            }
            #mobile-intro-modal .text-base, #modal p {
                font-size: 0.8rem !important;
                margin: 0.05rem 0 !important;
            }
            #mobile-intro-modal .text-xs {
                font-size: 0.6rem !important;
            }
            #mobile-intro-modal button, #modal button {
                padding-top: 0.35rem !important;
                padding-bottom: 0.35rem !important;
                font-size: 0.75rem !important;
                margin-top: 0.1rem !important;
            }
        }
    </style>
</head>
<!-- 將 justify-between 改為 justify-start，並透過 gap-3 讓上方資訊框與主遊戲畫面緊密且整齊地往上靠 -->
<body class="bg-amber-50 text-stone-800 h-screen flex flex-col items-center justify-start gap-3 p-3 select-none overflow-hidden relative">

    <!-- 手機直向警告遮罩 -->
    <div id="orientation-warning" class="fixed inset-0 bg-stone-900/95 z-50 flex-col items-center justify-center p-6 text-center space-y-4">
        <div class="text-6xl animate-bounce">📱🔄</div>
        <h2 class="text-2xl font-bold text-amber-500">請將手機轉為橫向遊玩</h2>
        <p class="text-stone-300 text-sm">為了最佳的遊戲體驗，請將您的手機調整為橫向模式！</p>
    </div>

    <!-- 手機版專屬：遊戲開始前目標解答彈窗 -->
    <div id="mobile-intro-modal" class="fixed inset-0 bg-stone-900/60 backdrop-blur-sm hidden items-center justify-center z-50 p-2">
        <div class="bg-white text-stone-800 border-2 border-amber-200 rounded-3xl p-5 max-w-sm w-full text-center shadow-2xl flex flex-col items-center justify-center">
            <div class="text-3xl">✝️</div>
            <h2 class="text-xl font-bold text-amber-800">尋找對象</h2>
            <div class="bg-amber-50 p-2.5 rounded-2xl border border-amber-200 shadow-inner my-1">
                <canvas id="canvas-mobile-target" width="60" height="60" class="rounded-xl block mx-auto"></canvas>
            </div>
            <div>
                <div class="text-base font-bold text-amber-900">耶穌</div>
                <div class="text-xs text-stone-500 mt-0.5">穿白袍、紅色斜背帶</div>
            </div>
            <button onclick="game.startMobileGame()" class="w-full bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-white font-bold py-2 rounded-xl shadow-lg transition active:scale-95 cursor-pointer text-sm mt-1">
                開始尋找！
            </button>
        </div>
    </div>

    <!-- 頂部導覽列 (PC端顯示) -->
    <header class="pc-header w-full max-w-7xl flex flex-wrap justify-between items-center bg-white/80 backdrop-blur-md px-5 py-2.5 rounded-2xl shadow-md border border-amber-200/60 shrink-0">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">✝️</span>
            <div>
                <h1 class="text-lg font-bold tracking-wide text-amber-800">Where's Jesus? 耶穌在哪?</h1>
                <p id="level-desc" class="text-xs text-stone-500">在茫茫人海中，找出耶穌！</p>
            </div>
        </div>
        <div class="flex items-center space-x-4 text-sm font-medium">
            <div class="bg-amber-100/70 px-3.5 py-1 rounded-xl border border-amber-200 text-stone-700">
                時間: <span id="timer-display" class="text-emerald-700 font-bold text-base">00:00</span>
            </div>
            <button onclick="game.restartLevel()" class="bg-emerald-700 hover:bg-emerald-600 text-white px-3.5 py-1.5 rounded-xl font-medium shadow transition active:scale-95 cursor-pointer text-xs">
                🔄 開啟新局
            </button>
        </div>
    </header>

    <!-- 手機版專屬上方資訊與控制列 -->
    <div class="hidden max-[900px]:flex mobile-header-bar w-full max-w-[98vw] items-center justify-between bg-white/90 backdrop-blur-md px-2.5 py-1 rounded-lg shadow-sm border border-amber-200 shrink-0">
        <div class="flex items-center space-x-1.5 text-xs font-medium text-stone-700">
            <span id="mobile-level-desc" class="font-bold text-amber-800 truncate max-w-[120px]">春意草原</span>
            <span class="text-stone-400">|</span>
            <span>時間: <span id="mobile-timer-display" class="text-emerald-700 font-bold">00:00</span></span>
        </div>
        <div class="flex items-center space-x-1">
            <button onclick="game.restartLevel()" class="bg-emerald-700 hover:bg-emerald-600 text-white px-2 py-0.5 rounded font-medium text-xs active:scale-95 cursor-pointer shadow">
                🔄 新局
            </button>
            <button onclick="game.showHint()" class="bg-amber-600 hover:bg-amber-500 text-white px-2.5 py-0.5 rounded font-medium text-xs active:scale-95 cursor-pointer shadow">
                💡 解答
            </button>
        </div>
    </div>

    <!-- 主遊戲區 -->
    <main class="w-full max-w-7xl flex flex-row gap-4 items-center justify-center relative shrink mobile-game-container">
        
        <!-- 遊戲主畫面 -->
        <div class="relative bg-white/60 p-1.5 rounded-xl shadow-md border-2 border-amber-200 canvas-container">
            <canvas id="canvas-game" width="1300" height="650" class="rounded-lg block bg-amber-50/85 w-auto h-auto object-contain"></canvas>
        </div>

        <!-- 右側：目標與控制側邊欄 (PC端顯示) -->
        <div class="pc-sidebar flex flex-col items-center justify-center bg-white/80 backdrop-blur-md p-3.5 rounded-2xl shadow-xl border border-amber-200/60 w-36 text-center space-y-3 shrink-0">
            <div class="text-xs text-stone-500 font-medium">尋找目標</div>
            <div class="bg-amber-50 p-2 rounded-xl border border-amber-200 shadow-inner">
                <canvas id="canvas-target" width="65" height="65" class="rounded-lg block mx-auto"></canvas>
            </div>
            <div>
                <div class="text-sm font-bold text-amber-900">耶穌</div>
                <div class="text-xs text-stone-500 mt-0.5">穿白袍、斜披紅帶</div>
            </div>
            <button id="btn-hint" onclick="game.showHint()" class="w-full bg-amber-600 hover:bg-amber-500 text-white py-2 rounded-xl font-medium shadow transition active:scale-95 cursor-pointer text-xs">
                💡 解答
            </button>
        </div>
    </main>

    <!-- 結算彈窗 -->
    <div id="modal" class="fixed inset-0 bg-stone-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-2">
        <div class="bg-white text-stone-800 border-2 border-amber-200 rounded-3xl p-6 max-w-md w-full text-center shadow-2xl flex flex-col items-center justify-center">
            <div id="modal-icon" class="text-5xl animate-bounce">🎉</div>
            <h2 id="modal-title" class="text-xl font-bold text-amber-700">恭喜過關</h2>
            <p id="modal-time" class="text-stone-600 text-sm font-medium my-2">你花費了 00:30 找到他！</p>
            <button onclick="game.nextLevel()" class="w-full bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-white font-bold py-2.5 rounded-xl shadow-lg transition active:scale-95 cursor-pointer text-sm mt-1">
                再找一次
            </button>
        </div>
    </div>

    <!-- 遊戲核心邏輯 -->
    <script>
        class JesusSearchGame {
            constructor() {
                this.canvasGame = document.getElementById('canvas-game');
                this.ctxGame = this.canvasGame.getContext('2d');
                this.canvasTarget = document.getElementById('canvas-target');
                this.ctxTarget = this.canvasTarget ? this.canvasTarget.getContext('2d') : null;
                
                this.canvasMobileTarget = document.getElementById('canvas-mobile-target');
                this.ctxMobileTarget = this.canvasMobileTarget ? this.canvasMobileTarget.getContext('2d') : null;

                this.level = 1;
                this.timerInterval = null;
                this.seconds = 0;
                this.soundEnabled = true;
                this.isLocked = false;
                this.hintTimeout = null;

                this.jesusPos = { x: 0, y: 0, radius: 14 };
                this.crowd = [];
                this.currentTheme = {};
                this.recentThemeIndices = [];

                this.themes = [
                    {
                        name: "春意草原",
                        bgGround: "#d9f99d",
                        bgRoad: "#fef9c3",
                        shirtColors: ['#38bdf8', '#34d399', '#fbbf24', '#a78bfa', '#f472b6', '#22d3ee', '#acc324', '#fb7185', '#818cf8'],
                        hairColors: ['#451a03', '#334155', '#92400e', '#57534e'],
                        treeColor: '#059669'
                    },
                    {
                        name: "溫馨麥田",
                        bgGround: "#fed7aa",
                        bgRoad: "#ffedd5",
                        shirtColors: ['#2563eb', '#059669', '#dc2626', '#7c3aed', '#db2777', '#0891b2', '#65a30d'],
                        hairColors: ['#292524', '#451a03', '#78350f'],
                        treeColor: '#b45309'
                    },
                    {
                        name: "柔和薰衣草",
                        bgGround: "#e9d5ff",
                        bgRoad: "#f3e8ff",
                        shirtColors: ['#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#06b6d4', '#6366f1', '#14b8a6'],
                        hairColors: ['#1e1b4b', '#312e81', '#4b5563'],
                        treeColor: '#7e22ce'
                    },
                    {
                        name: "晨曦櫻花",
                        bgGround: "#fbcfe8",
                        bgRoad: "#fdf2f8",
                        shirtColors: ['#0284c7', '#16a34a', '#ca8a04', '#9333ea', '#ea580c', '#0d9488', '#4f46e5'],
                        hairColors: ['#500724', '#3f3f46', '#713f12'],
                        treeColor: '#be185d'
                    }
                ];

                this.initEvents();
                this.startLevel();
            }

            initEvents() {
                const handleInput = (clientX, clientY) => {
                    const rect = this.canvasGame.getBoundingClientRect();
                    const scaleX = this.canvasGame.width / rect.width;
                    const scaleY = this.canvasGame.height / rect.height;
                    const x = (clientX - rect.left) * scaleX;
                    const y = (clientY - rect.top) * scaleY;

                    if (this.isLocked) return;
                    this.handleClick(x, y);
                };

                this.canvasGame.addEventListener('click', (e) => {
                    handleInput(e.clientX, e.clientY);
                });

                this.canvasGame.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (e.touches.length > 0) {
                        const touch = e.touches[0];
                        handleInput(touch.clientX, touch.clientY);
                    }
                }, { passive: false });
            }

            getRandomTheme() {
                let availableIndices = [];
                for (let i = 0; i < this.themes.length; i++) {
                    if (!this.recentThemeIndices.includes(i)) {
                        availableIndices.push(i);
                    }
                }
                if (availableIndices.length === 0) {
                    availableIndices = this.themes.map((_, i) => i);
                }
                const randomIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
                this.recentThemeIndices.push(randomIndex);
                if (this.recentThemeIndices.length >= 3) {
                    this.recentThemeIndices.shift();
                }
                return this.themes[randomIndex];
            }

            startLevel() {
                this.isLocked = true;
                this.seconds = 0;
                if (this.hintTimeout) {
                    clearTimeout(this.hintTimeout);
                    this.hintTimeout = null;
                }
                clearInterval(this.timerInterval);

                const timerDisplay = document.getElementById('timer-display');
                const mobileTimerDisplay = document.getElementById('mobile-timer-display');
                if (timerDisplay) timerDisplay.innerText = "00:00";
                if (mobileTimerDisplay) mobileTimerDisplay.innerText = "00:00";
                
                this.currentTheme = this.getRandomTheme();

                const levelDesc = document.getElementById('level-desc');
                const mobileLevelDesc = document.getElementById('mobile-level-desc');
                if (levelDesc) levelDesc.innerText = `主題：${this.currentTheme.name} - 找出耶穌！`;
                if (mobileLevelDesc) mobileLevelDesc.innerText = this.currentTheme.name;
                
                this.generateDenseCrowd();
                this.drawScene();
                this.drawTargetPreview();

                if (window.innerWidth <= 900) {
                    this.drawMobileTargetPreview();
                    const mobileIntro = document.getElementById('mobile-intro-modal');
                    if (mobileIntro) {
                        mobileIntro.classList.remove('hidden');
                        mobileIntro.classList.add('flex');
                    }
                } else {
                    this.isLocked = false;
                    this.startTimer();
                }
            }

            startMobileGame() {
                const mobileIntro = document.getElementById('mobile-intro-modal');
                if (mobileIntro) {
                    mobileIntro.classList.remove('flex');
                    mobileIntro.classList.add('hidden');
                }
                this.isLocked = false;
                this.startTimer();
            }

generateDenseCrowd() {
                this.crowd = [];
                
                // 調整耶穌的隨機垂直範圍以適應 650 高度
                this.jesusPos = {
                    x: 60 + Math.random() * 1180,
                    y: 60 + Math.random() * 520,
                    radius: 14
                };

                const { shirtColors, hairColors } = this.currentTheme;

                // 稍微增加人群數量以填滿更大的畫布空間
                for (let i = 0; i < 1300; i++) {
                    let cx = 25 + Math.random() * 1250;
                    let cy = 25 + Math.random() * 600;
                    
                    if (Math.hypot(cx - this.jesusPos.x, cy - this.jesusPos.y) < 18) continue;

                    this.crowd.push({
                        x: cx,
                        y: cy,
                        type: Math.random() > 0.12 ? 'person' : 'object',
                        shirtColor: shirtColors[Math.floor(Math.random() * shirtColors.length)],
                        hairColor: hairColors[Math.floor(Math.random() * hairColors.length)],
                        variant: Math.floor(Math.random() * 3)
                    });
                }
            }

            drawScene() {
                // 將背景底色填滿高度改為 650
                this.ctxGame.fillStyle = this.currentTheme.bgGround;
                this.ctxGame.fillRect(0, 0, 1300, 650);

                // 調整道路的貝茲曲線座標，使其完美向下延伸
                this.ctxGame.fillStyle = this.currentTheme.bgRoad;
                this.ctxGame.beginPath();
                this.ctxGame.moveTo(0, 220);
                this.ctxGame.bezierCurveTo(450, 80, 850, 520, 1300, 280);
                this.ctxGame.lineTo(1300, 430);
                this.ctxGame.bezierCurveTo(850, 630, 450, 220, 0, 370);
                this.ctxGame.closePath();
                this.ctxGame.fill();

                this.crowd.forEach(item => {
                    if (item.type === 'person') {
                        this.drawTinyPerson(this.ctxGame, item.x, item.y, item.shirtColor, item.hairColor);
                    } else {
                        this.drawTinyObject(this.ctxGame, item.x, item.y);
                    }
                });

                this.drawJesus(this.ctxGame, this.jesusPos.x, this.jesusPos.y);
            }

            drawTargetPreview() {
                if (!this.ctxTarget) return;
                this.ctxTarget.clearRect(0, 0, 65, 65);
                this.ctxTarget.fillStyle = "#fef3c7";
                this.ctxTarget.fillRect(0, 0, 65, 65);
                this.drawJesus(this.ctxTarget, 32.5, 35, 1.1);
            }

            drawMobileTargetPreview() {
                if (!this.ctxMobileTarget) return;
                this.ctxMobileTarget.clearRect(0, 0, 60, 60);
                this.ctxMobileTarget.fillStyle = "#fef3c7";
                this.ctxMobileTarget.fillRect(0, 0, 60, 60);
                this.drawJesus(this.ctxMobileTarget, 30, 32, 1.1);
            }

            drawTinyPerson(ctx, x, y, shirtColor, hairColor) {
                ctx.save();
                ctx.translate(x, y);
                ctx.strokeStyle = "#292524";
                ctx.lineWidth = 1.0;

                ctx.fillStyle = hairColor;
                ctx.beginPath();
                ctx.arc(0, -7, 4.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = "#fed7aa";
                ctx.beginPath();
                ctx.arc(0, -6, 3.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = shirtColor;
                ctx.fillRect(-4.5, -2, 9, 11);
                ctx.strokeRect(-4.5, -2, 9, 11);

                ctx.restore();
            }

            drawTinyObject(ctx, x, y) {
                ctx.save();
                ctx.translate(x, y);
                ctx.fillStyle = this.currentTheme.treeColor;
                ctx.strokeStyle = "#292524";
                ctx.lineWidth = 1.0;
                ctx.beginPath();
                ctx.arc(0, 0, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }

            drawJesus(ctx, x, y, scale = 0.85) {
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(scale, scale);
                ctx.strokeStyle = "#292524";
                ctx.lineWidth = 1.1;

                ctx.fillStyle = "#451a03";
                ctx.beginPath();
                ctx.arc(0, -7, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = "#fed7aa";
                ctx.beginPath();
                ctx.arc(0, -6, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = "#451a03";
                ctx.fillRect(-1.5, -4.5, 3, 2.5);

                ctx.fillStyle = "#ffffff";
                ctx.fillRect(-4.5, -2, 9, 14);
                ctx.strokeRect(-4.5, -2, 9, 14);

                ctx.fillStyle = "#e11d48";
                ctx.beginPath();
                ctx.moveTo(-4.5, -2);
                ctx.lineTo(-1.5, -2);
                ctx.lineTo(4.5, 9.5);
                ctx.lineTo(1.5, 9.5);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = "#78350f";
                ctx.fillRect(-4.5, 4, 9, 2.2);
                ctx.strokeRect(-4.5, 4, 9, 2.2);

                ctx.restore();
            }

            handleClick(x, y) {
                const dist = Math.hypot(x - this.jesusPos.x, y - this.jesusPos.y);
                if (dist <= 22) {
                    this.isLocked = true;
                    if (this.hintTimeout) {
                        clearTimeout(this.hintTimeout);
                        this.hintTimeout = null;
                    }
                    this.drawSuccessMarker(this.ctxGame, this.jesusPos.x, this.jesusPos.y);
                    this.playSound('success');
                    clearInterval(this.timerInterval);
                    
                    setTimeout(() => {
                        this.endLevel();
                    }, 1500);
                } else {
                    this.drawWrongMarker(this.ctxGame, x, y);
                    this.playSound('wrong');
                }
            }

            drawSuccessMarker(ctx, x, y) {
                ctx.save();
                ctx.strokeStyle = '#e11d48';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.arc(x, y, 28, 0, Math.PI * 2);
                ctx.stroke();

                ctx.strokeStyle = '#ffe4e6';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(x, y, 34, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }

            drawWrongMarker(ctx, x, y) {
                ctx.save();
                ctx.strokeStyle = '#e11d48';
                ctx.lineWidth = 3.5;
                ctx.beginPath();
                ctx.arc(x, y, 16, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }

            showHint() {
                if (this.isLocked) return;
                if (this.hintTimeout) clearTimeout(this.hintTimeout);

                this.drawSuccessMarker(this.ctxGame, this.jesusPos.x, this.jesusPos.y);

                this.hintTimeout = setTimeout(() => {
                    this.drawScene();
                    this.hintTimeout = null;
                }, 2000);
            }

            startTimer() {
                clearInterval(this.timerInterval);
                this.timerInterval = setInterval(() => {
                    this.seconds++;
                    const m = String(Math.floor(this.seconds / 60)).padStart(2, '0');
                    const s = String(this.seconds % 60).padStart(2, '0');
                    const timerDisplay = document.getElementById('timer-display');
                    const mobileTimerDisplay = document.getElementById('mobile-timer-display');
                    if (timerDisplay) timerDisplay.innerText = `${m}:${s}`;
                    if (mobileTimerDisplay) mobileTimerDisplay.innerText = `${m}:${s}`;
                }, 1000);
            }

            endLevel() {
                const m = String(Math.floor(this.seconds / 60)).padStart(2, '0');
                const s = String(this.seconds % 60).padStart(2, '0');
                const modalTime = document.getElementById('modal-time');
                if (modalTime) {
                    modalTime.innerText = `只花了 ${m}分${s}秒 就找到耶穌！`;
                }
                const modal = document.getElementById('modal');
                if (modal) {
                    modal.classList.remove('hidden');
                    modal.classList.add('flex');
                }
            }

            nextLevel() {
                const modal = document.getElementById('modal');
                if (modal) {
                    modal.classList.remove('flex');
                    modal.classList.add('hidden');
                }
                this.level++;
                this.startLevel();
            }

            restartLevel() {
                this.startLevel();
            }

            playSound(type) {
                if (!this.soundEnabled) return;
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'success') {
                    const now = ctx.currentTime;
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.1);
                    osc.frequency.setValueAtTime(783.99, now + 0.2);
